<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>医学英単語マスター (Medical English Vocab Master)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* 3Dカード反転スタイル */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    /* レンジスライダーのカスタマイズ */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 9999px;
      background: #e2e8f0;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      border: 2.5px solid #4f46e5;
      box-shadow: 0 2px 5px rgba(79, 70, 229, 0.25);
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      border: 2.5px solid #4f46e5;
      box-shadow: 0 2px 5px rgba(79, 70, 229, 0.25);
      cursor: pointer;
    }

    /* スクロールバー */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #f8fafc;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 min-h-screen flex justify-center items-start sm:py-6 p-0 select-none">

  <!-- メインコンテナ -->
  <div class="w-full max-w-md bg-white sm:rounded-3xl sm:shadow-2xl sm:border sm:border-slate-100 overflow-hidden flex flex-col min-h-screen sm:min-h-[780px]">

    <!-- 1. ヘッダーエリア -->
    <header class="bg-[#4f46e5] text-white px-4 py-3 flex items-center justify-between shadow-sm relative z-10">
      <div class="flex items-center gap-2">
        <div class="p-1.5 bg-white/15 rounded-xl backdrop-blur-sm">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
          </svg>
        </div>
        <div>
          <h1 class="text-sm sm:text-base font-extrabold tracking-tight">医学英単語マスター</h1>
          <p class="text-[10px] text-indigo-200 font-medium leading-none">Medical English Vocab Complete</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <!-- 一覧モーダルボタン -->
        <button id="openListModalBtn" class="bg-white/15 hover:bg-white/25 active:scale-95 transition-all text-white p-1.5 rounded-full" title="単語一覧を開く">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h7" />
          </svg>
        </button>
        <!-- Saved バッジ -->
        <div id="saveBadge" class="bg-white/20 backdrop-blur-sm text-white text-[11px] px-2 py-0.5 rounded-full flex items-center gap-1 font-semibold">
          <svg class="w-3 h-3 text-emerald-300" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
          </svg>
          <span id="saveStatusText">Saved</span>
        </div>
        <!-- カウンターバッジ -->
        <div id="counterBadge" class="bg-white/25 backdrop-blur-sm text-white text-xs px-2.5 py-1 rounded-full font-bold">
          1 / 540
        </div>
      </div>
    </header>

    <!-- コース切り替えタブ（統合ナビゲーション） -->
    <nav class="bg-indigo-50/80 p-1.5 flex gap-1 border-b border-indigo-100 text-xs font-bold">
      <button id="courseTabAll" class="flex-1 py-1.5 rounded-xl text-center transition-all bg-white text-indigo-700 shadow-sm border border-indigo-200">
        総合 (全540)
      </button>
      <button id="courseTabM3" class="flex-1 py-1.5 rounded-xl text-center transition-all text-slate-600 hover:text-indigo-600 hover:bg-white/60">
        M3春 系統別 (295)
      </button>
      <button id="courseTabPsy" class="flex-1 py-1.5 rounded-xl text-center transition-all text-slate-600 hover:text-indigo-600 hover:bg-white/60">
        精神神経医学 (245)
      </button>
    </nav>

    <!-- プログレスバー -->
    <div class="w-full bg-slate-100 h-1">
      <div id="progressBar" class="bg-indigo-500 h-1 transition-all duration-300" style="width: 0.2%;"></div>
    </div>

    <!-- コンテンツメイン -->
    <main class="flex-1 p-3.5 flex flex-col justify-between gap-3">

      <!-- 2. コントロールバー -->
      <section class="grid grid-cols-12 gap-2 items-center">
        <!-- 領域/出題年サブフィルター -->
        <div class="col-span-6 relative">
          <select id="filterSelect" class="w-full appearance-none bg-white border border-slate-200 hover:border-indigo-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 cursor-pointer pr-7 truncate">
            <!-- JSで動的生成 -->
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 9l4-4 4 4m0 6l-4 4-4-4" />
            </svg>
          </div>
        </div>

        <!-- ✓Only トグルボタン -->
        <button id="checkedOnlyBtn" class="col-span-3 h-full border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 rounded-xl px-1.5 py-2 text-xs font-bold flex items-center justify-center gap-1 shadow-sm transition-all">
          <span id="checkOnlyIcon" class="text-xs">☐</span>
          <span>✓Only</span>
        </button>

        <!-- 🔄 OFF/ON トグルボタン (シャッフル) -->
        <button id="shuffleToggleBtn" class="col-span-3 h-full border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 rounded-xl px-1.5 py-2 text-xs font-bold flex items-center justify-center gap-1 shadow-sm transition-all">
          <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span id="shuffleStatusText">OFF</span>
        </button>
      </section>

      <!-- 3. オートプレイ設定バー -->
      <section class="border border-slate-200/90 rounded-2xl p-3 bg-white shadow-sm flex flex-col gap-2">
        <div class="flex items-center justify-between text-xs">
          <div class="flex items-center gap-1 text-slate-500 font-bold">
            <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span>オートプレイ設定</span>
          </div>

          <!-- 方向切り替え (英→日 / 日→英) -->
          <button id="directionToggleBtn" class="flex items-center gap-1 text-slate-600 font-bold hover:text-indigo-600 transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
            </svg>
            <span id="directionText">英 → 日</span>
          </button>
        </div>

        <div class="flex items-center gap-3 pt-0.5">
          <!-- 再生/停止ボタン -->
          <button id="autoPlayBtn" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200/80 rounded-xl px-4 py-1.5 text-xs font-bold flex items-center gap-1.5 transition-all shadow-sm active:scale-95 shrink-0">
            <svg id="autoPlayIcon" class="w-3 h-3 fill-current" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <span id="autoPlayBtnText">再生</span>
          </button>

          <!-- スライダー + 秒数表示 -->
          <div class="flex-1 flex flex-col justify-center">
            <span id="intervalLabel" class="text-[10px] text-slate-400 font-medium leading-none mb-1">日本語表示: 2.5秒</span>
            <input id="intervalSlider" type="range" min="1" max="7" value="2.5" step="0.5" class="w-full cursor-pointer">
          </div>
        </div>
      </section>

      <!-- 4. メインフラッシュカード -->
      <section class="perspective-1000 my-0.5">
        <div id="flashcard" class="relative w-full h-[270px] sm:h-[290px] transform-style-3d transition-transform duration-500 cursor-pointer">
          
          <!-- カード表面 (英語) -->
          <div class="absolute inset-0 w-full h-full bg-white rounded-3xl border border-slate-200 shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-6 flex flex-col justify-between items-center backface-hidden">
            <!-- 上部：言語ラベル ＆ 発音ボタン -->
            <div class="flex items-center justify-center gap-1.5">
              <span id="cardLangFront" class="text-xs text-slate-400 font-bold tracking-wider">英語</span>
              <button id="ttsBtnFront" class="text-slate-500 hover:text-indigo-600 transition-colors inline-flex items-center p-0.5 rounded" title="発音を聞く">
                <span class="text-base leading-none">🔊</span>
              </button>
            </div>
            
            <!-- 中央：単語テキスト -->
            <div class="flex flex-col items-center justify-center flex-1 px-2 text-center w-full my-auto">
              <h2 id="cardTextFront" class="text-2xl sm:text-3xl font-medium text-[#1e293b] tracking-normal leading-snug break-words">
                Angiography
              </h2>
            </div>

            <!-- 下部：セクション＆出題年度バッジ -->
            <div id="sectionBadgeFront" class="flex items-center justify-center gap-1.5 flex-wrap min-h-[26px]">
              <!-- JSで動的挿入 -->
            </div>
          </div>

          <!-- カード裏面 (日本語) -->
          <div class="absolute inset-0 w-full h-full bg-[#fbf9fe] rounded-3xl border border-purple-200/80 shadow-[0_8px_30px_rgb(0,0,0,0.05)] p-6 flex flex-col justify-between items-center backface-hidden rotate-y-180">
            <!-- 上部：言語ラベル ＆ 発音ボタン -->
            <div class="flex items-center justify-center gap-1.5">
              <span id="cardLangBack" class="text-xs text-slate-500 font-bold tracking-wider">日本語</span>
              <button id="ttsBtnBack" class="text-slate-500 hover:text-indigo-600 transition-colors inline-flex items-center p-0.5 rounded" title="英語の発音を聞く">
                <span class="text-base leading-none">🔊</span>
              </button>
            </div>
            
            <!-- 中央：対訳テキスト -->
            <div class="flex flex-col items-center justify-center flex-1 px-2 text-center w-full my-auto">
              <h2 id="cardTextBack" class="text-2xl sm:text-3xl font-medium text-[#1e293b] tracking-normal leading-snug break-words">
                血管造影
              </h2>
            </div>

            <!-- 下部：セクション＆出題年度バッジ -->
            <div id="sectionBadgeBack" class="flex items-center justify-center gap-1.5 flex-wrap min-h-[26px]">
              <!-- JSで動的挿入 -->
            </div>
          </div>

        </div>
      </section>

      <!-- 5. 「分からない単語としてチェック」ボタン -->
      <section>
        <button id="checkCardBtn" class="w-full rounded-2xl py-3.5 px-4 font-bold text-xs sm:text-sm flex items-center justify-center gap-2 border-2 transition-all shadow-sm active:scale-[0.99] border-slate-200 bg-white text-slate-600 hover:border-slate-300">
          <svg class="w-4 h-4 text-slate-400" id="cardCheckIcon" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
          </svg>
          <span id="cardCheckText">分からない単語としてチェック</span>
        </button>
      </section>

      <!-- 6. ナビゲーションフッター -->
      <footer class="flex items-center gap-2 pt-1 pb-1">
        <!-- 前へボタン -->
        <button id="prevBtn" class="w-[32%] py-3.5 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-bold text-xs sm:text-sm shadow-sm active:scale-95 transition-all flex items-center justify-center gap-1">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
          <span>前へ</span>
        </button>

        <!-- リセット・反転初期化ボタン -->
        <button id="resetFlipBtn" title="表裏をリセット" class="w-12 h-[48px] rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 font-bold shadow-sm active:scale-95 transition-all flex items-center justify-center shrink-0">
          <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>

        <!-- 次へボタン -->
        <button id="nextBtn" class="flex-1 py-3.5 rounded-2xl bg-[#4f46e5] hover:bg-[#4338ca] text-white font-bold text-xs sm:text-sm shadow-md shadow-indigo-200 active:scale-95 transition-all flex items-center justify-center gap-1">
          <span>次へ</span>
          <svg class="w-4 h-4 text-white/90" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </footer>

    </main>
  </div>

  <!-- 単語一覧モーダル -->
  <div id="listModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-end sm:items-center hidden opacity-0 transition-opacity duration-200">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[88vh] flex flex-col shadow-2xl overflow-hidden">
      <!-- モーダルヘッダー -->
      <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-indigo-50/60">
        <div class="flex items-center gap-2">
          <span class="text-base sm:text-lg font-black text-slate-800">医学英語 必修単語一覧</span>
          <span id="modalListCount" class="text-xs sm:text-sm font-bold text-indigo-600 bg-indigo-100 px-2.5 py-0.5 rounded-full">0語</span>
        </div>
        <button id="closeListModalBtn" class="p-1.5 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-100 transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- 検索入力 -->
      <div class="p-3 border-b border-slate-100 bg-white">
        <div class="relative">
          <input id="modalSearchInput" type="text" placeholder="英語または日本語で検索..." class="w-full bg-slate-100 text-sm rounded-xl pl-9 pr-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-400 font-medium placeholder:text-slate-400">
          <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
      </div>

      <!-- リストコンテナ -->
      <div id="modalWordContainer" class="flex-1 overflow-y-auto p-3 divide-y divide-slate-100"></div>
    </div>
  </div>

  <!-- JavaScript アプリケーションロジック -->
  <script>
    /**
     * 2つのデータセットを統合した全540語のマスターデータ
     */
    const masterWordList = [
      // ==========================================

    // チェック状態の読み込み
    function loadSavedChecks() {
      try {
        // 旧ストレージデータからの移行も考慮
        let checkedIds = [];
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          checkedIds = JSON.parse(saved);
        } else {
          // 旧M3チェックの引き継ぎ
          const m3Saved = localStorage.getItem("medical_english_vocab_essential_295");
          if (m3Saved) {
            const oldM3 = JSON.parse(m3Saved);
            checkedIds.push(...oldM3.map(n => `m3_${n}`));
          }
          // 旧精神科チェックの引き継ぎ
          const psySaved = localStorage.getItem("toho_psychiatry_vocab_2025_checked");
          if (psySaved) {
            const oldPsy = JSON.parse(psySaved);
            checkedIds.push(...oldPsy.map(n => `psy_${n}`));
          }
        }
        masterWordList.forEach(w => {
          w.checked = checkedIds.includes(w.id);
        });
      } catch (e) {
        console.warn("Storage access warning", e);
      }
    }

    // チェック状態の保存
    function saveChecks() {
      try {
        const checkedIds = masterWordList.filter(w => w.checked).map(w => w.id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(checkedIds));
        showSavedIndicator();
      } catch (e) {
        console.warn("Could not save checks", e);
      }
    }

    function showSavedIndicator() {
      saveStatusText.textContent = "Saved";
      saveStatusText.parentElement.classList.add("scale-105");
      setTimeout(() => {
        saveStatusText.parentElement.classList.remove("scale-105");
      }, 300);
    }

    // コース切り替えタブの設定
    function setupCourseTabs() {
      const tabs = [
        { btn: courseTabAll, course: "all" },
        { btn: courseTabM3, course: "m3" },
        { btn: courseTabPsy, course: "psy" }
      ];

      tabs.forEach(({ btn, course }) => {
        btn.addEventListener("click", () => {
          if (selectedCourse === course) return;
          selectedCourse = course;
          
          // タブのアクティブスタイル更新
          tabs.forEach(t => {
            if (t.course === selectedCourse) {
              t.btn.className = "flex-1 py-1.5 rounded-xl text-center transition-all bg-white text-indigo-700 shadow-sm border border-indigo-200";
            } else {
              t.btn.className = "flex-1 py-1.5 rounded-xl text-center transition-all text-slate-600 hover:text-indigo-600 hover:bg-white/60";
            }
          });

          updateSubFilterOptions();
          updateFilteredList();
          renderCard();
        });
      });
    }

    // コースに応じたサブフィルターの選択肢生成
    function updateSubFilterOptions() {
      let optionsHTML = "";

      if (selectedCourse === "all") {
        optionsHTML = `
          <option value="all">すべての単語 (全540語)</option>
          <option value="course_m3">M3春 系統別のみ (295語)</option>
          <option value="course_psy">精神神経医学のみ (245語)</option>
          <option value="has_years">🔥 過去問出題歴あり</option>
          <option value="frequent">⭐ 超頻出 (2回以上出題)</option>
        `;
      } else if (selectedCourse === "m3") {
        const m3List = masterWordList.filter(w => w.category === "m3");
        const sections = Array.from(new Set(m3List.map(w => w.section)));
        optionsHTML = `<option value="all">すべての領域 (全295語)</option>`;
        sections.forEach(sec => {
          const count = m3List.filter(w => w.section === sec).length;
          optionsHTML += `<option value="sec_${sec}">${sec} (${count}語)</option>`;
        });
      } else if (selectedCourse === "psy") {
        optionsHTML = `
          <option value="all">すべて (全245語)</option>
          <option value="has_years">🔥 過去問出題歴あり</option>
          <option value="frequent">⭐ 超頻出 (2回以上出題)</option>
          <option value="y24">2024年 出題 ('24)</option>
          <option value="y23">2023年 出題 ('23)</option>
          <option value="y22">2022年 出題 ('22)</option>
          <option value="y21">2021年 出題 ('21)</option>
          <option value="y20">2020年 出題 ('20)</option>
          <option value="y19">2019年 出題 ('19)</option>
        `;
      }

      filterSelect.innerHTML = optionsHTML;
    }

    // フィルターの適用
    function updateFilteredList() {
      const filterVal = filterSelect.value;
      let list = [...masterWordList];

      // 1. コース絞り込み
      if (selectedCourse === "m3") {
        list = list.filter(w => w.category === "m3");
      } else if (selectedCourse === "psy") {
        list = list.filter(w => w.category === "psychiatry");
      }

      // 2. サブフィルター絞り込み
      if (filterVal === "course_m3") {
        list = list.filter(w => w.category === "m3");
      } else if (filterVal === "course_psy") {
        list = list.filter(w => w.category === "psychiatry");
      } else if (filterVal.startsWith("sec_")) {
        const secName = filterVal.replace("sec_", "");
        list = list.filter(w => w.section === secName);
      } else if (filterVal === "has_years") {
        list = list.filter(w => w.years && w.years.length > 0);
      } else if (filterVal === "frequent") {
        list = list.filter(w => w.years && w.years.length >= 2);
      } else if (filterVal.startsWith("y")) {
        const targetYear = filterVal.replace("y", "");
        list = list.filter(w => w.years && w.years.includes(targetYear));
      }

      // 3. ✓Only 絞り込み
      if (isCheckedOnly) {
        list = list.filter(w => w.checked);
      }

      // 4. シャッフル
      if (isShuffle) {
        for (let i = list.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [list[i], list[j]] = [list[j], list[i]];
        }
      }

      activeList = list;
      currentIndex = 0;
      isFlipped = false;
      applyFlipState();
    }

    // カード描画
    function renderCard() {
      const total = activeList.length;

      if (total === 0) {
        counterBadge.textContent = "0 / 0";
        progressBar.style.width = "0%";
        cardTextFront.textContent = "該当単語なし";
        cardTextBack.textContent = "-";
        sectionBadgeFront.innerHTML = "";
        sectionBadgeBack.innerHTML = "";
        updateCheckBtnUI(false);
        return;
      }

      if (currentIndex >= total) currentIndex = 0;
      if (currentIndex < 0) currentIndex = total - 1;

      const word = activeList[currentIndex];
      counterBadge.textContent = `${currentIndex + 1} / ${total}`;
      progressBar.style.width = `${((currentIndex + 1) / total) * 100}%`;

      // 日英の向き
      if (isEnToJa) {
        cardLangFront.textContent = "英語";
        cardTextFront.textContent = word.en;
        cardLangBack.textContent = "日本語";
        cardTextBack.textContent = word.ja;
        intervalLabel.textContent = `日本語表示: ${playIntervalSec}秒`;
      } else {
        cardLangFront.textContent = "日本語";
        cardTextFront.textContent = word.ja;
        cardLangBack.textContent = "英語";
        cardTextBack.textContent = word.en;
        intervalLabel.textContent = `英語表示: ${playIntervalSec}秒`;
      }

      // セクション＆過去問年度バッジの生成
      const badgeHTML = createCombinedBadges(word);
      sectionBadgeFront.innerHTML = badgeHTML;
      sectionBadgeBack.innerHTML = badgeHTML;

      updateCheckBtnUI(word.checked);
    }

    // 複合バッジHTML生成
    function createCombinedBadges(word) {
      let html = `
        <span class="inline-flex items-center justify-center bg-indigo-50 text-indigo-700 border border-indigo-200/80 text-[11px] sm:text-xs font-bold px-3 py-0.5 rounded-lg shadow-2xs">
          ${word.category === 'm3' ? 'M3: ' + word.section : '精神神経医学'}
        </span>
      `;
      if (word.years && word.years.length > 0) {
        word.years.forEach(y => {
          html += `
            <span class="inline-flex items-center justify-center bg-[#fee2e2] text-[#991b1b] border border-[#fecaca] text-[11px] sm:text-xs font-bold px-2 py-0.5 rounded-lg shadow-2xs">
              ’${y} 出題
            </span>
          `;
        });
      }
      return html;
    }

    // チェックボタンUI
    function updateCheckBtnUI(isChecked) {
      if (isChecked) {
        checkCardBtn.className = "w-full rounded-2xl py-3.5 px-4 font-bold text-xs sm:text-sm flex items-center justify-center gap-2 border-2 transition-all shadow-sm border-indigo-200 bg-[#ede9fe] text-[#5b21b6]";
        cardCheckIcon.innerHTML = `
          <rect x="3" y="3" width="18" height="18" rx="4" fill="#5b21b6" stroke="#5b21b6" stroke-width="2"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M7 12.5l3.5 3.5 6.5-7" stroke="#ffffff" stroke-width="2.5"/>
        `;
        cardCheckText.textContent = "分からない単語 (チェック済み)";
      } else {
        checkCardBtn.className = "w-full rounded-2xl py-3.5 px-4 font-bold text-xs sm:text-sm flex items-center justify-center gap-2 border-2 transition-all shadow-sm border-slate-200 bg-white text-slate-600 hover:border-slate-300";
        cardCheckIcon.innerHTML = `<rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>`;
        cardCheckText.textContent = "分からない単語としてチェック";
      }
    }

    // カードの反転
    function toggleFlip() {
      if (activeList.length === 0) return;
      isFlipped = !isFlipped;
      applyFlipState();
    }

    function applyFlipState() {
      if (isFlipped) {
        flashcard.classList.add("rotate-y-180");
      } else {
        flashcard.classList.remove("rotate-y-180");
      }
    }

    function nextCard() {
      if (activeList.length === 0) return;
      currentIndex = (currentIndex + 1) % activeList.length;
      isFlipped = false;
      applyFlipState();
      renderCard();
    }

    function prevCard() {
      if (activeList.length === 0) return;
      currentIndex = (currentIndex - 1 + activeList.length) % activeList.length;
      isFlipped = false;
      applyFlipState();
      renderCard();
    }

    function toggleCheck() {
      if (activeList.length === 0) return;
      const word = activeList[currentIndex];
      word.checked = !word.checked;

      const target = masterWordList.find(w => w.id === word.id);
      if (target) target.checked = word.checked;

      saveChecks();
      updateCheckBtnUI(word.checked);

      if (isCheckedOnly && !word.checked) {
        updateFilteredList();
        renderCard();
      }
    }

    // 英語発音 (Web Speech API)
    function speakEnglish(e) {
      if (e) e.stopPropagation();
      if (activeList.length === 0) return;
      const word = activeList[currentIndex];
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterText = word.en.split('/')[0].replace(/【.*?】/g, '').trim();
        const utter = new SpeechSynthesisUtterance(utterText);
        utter.lang = 'en-US';
        utter.rate = 0.9;
        window.speechSynthesis.speak(utter);
      }
    }

    // オートプレイ
    function toggleAutoPlay() {
      if (isAutoPlaying) {
        stopAutoPlay();
      } else {
        startAutoPlay();
      }
    }

    function startAutoPlay() {
      if (activeList.length === 0) return;
      isAutoPlaying = true;
      autoPlayBtn.className = "bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-300 rounded-xl px-4 py-1.5 text-xs font-bold flex items-center gap-1.5 transition-all shadow-sm shrink-0";
      autoPlayIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
      autoPlayBtnText.textContent = "停止";

      runAutoPlayStep();
    }

    function stopAutoPlay() {
      isAutoPlaying = false;
      if (autoPlayTimer) clearTimeout(autoPlayTimer);
      autoPlayBtn.className = "bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200/80 rounded-xl px-4 py-1.5 text-xs font-bold flex items-center gap-1.5 transition-all shadow-sm shrink-0";
      autoPlayIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
      autoPlayBtnText.textContent = "再生";
    }

    function runAutoPlayStep() {
      if (!isAutoPlaying) return;
      const durationMs = playIntervalSec * 1000;

      if (!isFlipped) {
        autoPlayTimer = setTimeout(() => {
          if (!isAutoPlaying) return;
          toggleFlip();
          runAutoPlayStep();
        }, durationMs);
      } else {
        autoPlayTimer = setTimeout(() => {
          if (!isAutoPlaying) return;
          nextCard();
          runAutoPlayStep();
        }, durationMs * 0.9);
      }
    }

    // 単語一覧モーダル
    function openListModal() {
      listModal.classList.remove("hidden");
      setTimeout(() => listModal.classList.remove("opacity-0"), 10);
      renderModalList(modalSearchInput.value || "");
    }

    function closeListModal() {
      listModal.classList.add("opacity-0");
      setTimeout(() => listModal.classList.add("hidden"), 200);
    }

    // 単語一覧の描画
    function renderModalList(searchQuery) {
      const q = searchQuery.toLowerCase().trim();
      
      // 現在のコース選択に応じたリスト母集団
      let baseList = masterWordList;
      if (selectedCourse === "m3") baseList = masterWordList.filter(w => w.category === "m3");
      if (selectedCourse === "psy") baseList = masterWordList.filter(w => w.category === "psychiatry");

      const filtered = baseList.filter(w => {
        return w.en.toLowerCase().includes(q) || 
               w.ja.includes(q) || 
               w.section.includes(q) ||
               (w.years && w.years.some(y => y.includes(q)));
      });

      modalListCount.textContent = `${filtered.length}語`;
      modalWordContainer.innerHTML = filtered.map(w => {
        const isChecked = !!w.checked;
        const yearTags = (w.years && w.years.length > 0)
          ? w.years.map(y => `<span class="bg-[#fee2e2] text-[#991b1b] text-[10px] font-bold px-1.5 py-0.2 rounded border border-[#fecaca]">’${y} 出題</span>`).join(" ")
          : "";

        return `
          <div class="py-3 px-2.5 flex items-center justify-between hover:bg-slate-50 rounded-2xl transition-colors group">
            <div class="flex-1 pr-3 cursor-pointer" onclick="jumpToWord('${w.id}')">
              <div class="flex items-center gap-1.5 flex-wrap mb-1">
                <span class="font-medium text-slate-900 text-sm sm:text-base group-hover:text-indigo-600 transition-colors leading-snug">${w.en}</span>
                <span class="bg-indigo-50 text-indigo-700 text-[11px] font-semibold px-2 py-0.5 rounded-md border border-indigo-100">${w.category === 'm3' ? w.section : '精神神経医学'}</span>
                ${yearTags}
              </div>
              <div class="text-slate-600 font-normal text-sm sm:text-[15px] leading-snug">${w.ja}</div>
            </div>

            <!-- リストから直接切り替え可能なチェックボタン -->
            <button 
              type="button"
              onclick="toggleWordCheckFromModal('${w.id}', event)"
              class="w-9 h-9 rounded-xl flex items-center justify-center transition-all shrink-0 active:scale-95 ${isChecked ? 'bg-[#ede9fe] text-[#5b21b6] border border-indigo-200' : 'bg-slate-50 text-slate-400 hover:bg-slate-100 border border-slate-200'}"
              title="${isChecked ? 'チェックを解除' : 'チェックを付ける'}"
            >
              ${isChecked ? `
                <svg class="w-5 h-5 text-[#5b21b6]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
              ` : `
                <span class="text-sm text-slate-400">☐</span>
              `}
            </button>
          </div>
        `;
      }).join("");
    }

    // モーダルリストから直接チェックを切り替える関数
    window.toggleWordCheckFromModal = function(wordId, event) {
      if (event) event.stopPropagation();

      const target = masterWordList.find(w => w.id === wordId);
      if (!target) return;

      target.checked = !target.checked;
      saveChecks();

      // 現在表示中のカードがこの単語であればカードUIも即時同期
      if (activeList.length > 0 && activeList[currentIndex] && activeList[currentIndex].id === wordId) {
        updateCheckBtnUI(target.checked);
      }

      // ✓Onlyモードの場合はアクティブリストを再計算
      if (isCheckedOnly) {
        updateFilteredList();
        renderCard();
      }

      // リストのチェック表示を再描画
      renderModalList(modalSearchInput.value || "");
    };

    window.jumpToWord = function(wordId) {
      const idx = activeList.findIndex(w => w.id === wordId);
      if (idx !== -1) {
        currentIndex = idx;
      } else {
        // 現在のフィルターで該当しない場合は総合コース・全件表示に戻す
        selectedCourse = "all";
        [courseTabAll, courseTabM3, courseTabPsy].forEach(t => {
          t.className = (t === courseTabAll) 
            ? "flex-1 py-1.5 rounded-xl text-center transition-all bg-white text-indigo-700 shadow-sm border border-indigo-200"
            : "flex-1 py-1.5 rounded-xl text-center transition-all text-slate-600 hover:text-indigo-600 hover:bg-white/60";
        });
        updateSubFilterOptions();
        filterSelect.value = "all";
        isCheckedOnly = false;
        checkedOnlyBtn.className = "col-span-3 h-full border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 rounded-xl px-1.5 py-2 text-xs font-bold flex items-center justify-center gap-1 shadow-sm transition-all";
        checkOnlyIcon.textContent = "☐";
        updateFilteredList();
        currentIndex = activeList.findIndex(w => w.id === wordId);
      }
      isFlipped = false;
      applyFlipState();
      renderCard();
      closeListModal();
    };

    // イベント登録
    function setupEventListeners() {
      flashcard.addEventListener("click", toggleFlip);
      nextBtn.addEventListener("click", nextCard);
      prevBtn.addEventListener("click", prevCard);
      resetFlipBtn.addEventListener("click", () => {
        isFlipped = false;
        applyFlipState();
      });

      checkCardBtn.addEventListener("click", toggleCheck);
      ttsBtnFront.addEventListener("click", speakEnglish);
      ttsBtnBack.addEventListener("click", speakEnglish);

      filterSelect.addEventListener("change", () => {
        updateFilteredList();
        renderCard();
      });

      checkedOnlyBtn.addEventListener("click", () => {
        isCheckedOnly = !isCheckedOnly;
        if (isCheckedOnly) {
          checkedOnlyBtn.className = "col-span-3 h-full border border-indigo-300 bg-[#ede9fe] text-[#5b21b6] rounded-xl px-1.5 py-2 text-xs font-bold flex items-center justify-center gap-1 shadow-sm transition-all";
          checkOnlyIcon.textContent = "☑";
        } else {
          checkedOnlyBtn.className = "col-span-3 h-full border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 rounded-xl px-1.5 py-2 text-xs font-bold flex items-center justify-center gap-1 shadow-sm transition-all";
          checkOnlyIcon.textContent = "☐";
        }
        updateFilteredList();
        renderCard();
      });

      shuffleToggleBtn.addEventListener("click", () => {
        isShuffle = !isShuffle;
        if (isShuffle) {
          shuffleStatusText.textContent = "ON";
          shuffleToggleBtn.classList.add("text-indigo-600", "border-indigo-200", "bg-indigo-50/50");
        } else {
          shuffleStatusText.textContent = "OFF";
          shuffleToggleBtn.classList.remove("text-indigo-600", "border-indigo-200", "bg-indigo-50/50");
        }
        updateFilteredList();
        renderCard();
      });

      directionToggleBtn.addEventListener("click", () => {
        isEnToJa = !isEnToJa;
        directionText.textContent = isEnToJa ? "英 → 日" : "日 → 英";
        isFlipped = false;
        applyFlipState();
        renderCard();
      });

      intervalSlider.addEventListener("input", (e) => {
        playIntervalSec = parseFloat(e.target.value);
        intervalLabel.textContent = `${isEnToJa ? "日本語" : "英語"}表示: ${playIntervalSec}秒`;
      });

      autoPlayBtn.addEventListener("click", toggleAutoPlay);

      openListModalBtn.addEventListener("click", openListModal);
      closeListModalBtn.addEventListener("click", closeListModal);
      modalSearchInput.addEventListener("input", (e) => renderModalList(e.target.value));

      window.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
        if (e.key === "ArrowRight") nextCard();
        if (e.key === "ArrowLeft") prevCard();
        if (e.key === " ") {
          e.preventDefault();
          toggleFlip();
        }
        if (e.key === "ArrowUp") {
          e.preventDefault();
          toggleCheck();
        }
        if (e.key === "s" || e.key === "S") {
          speakEnglish();
        }
      });
    }

    window.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
