<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, m6ximum-scale=1.0, user-scalable=no">
  <title>精神神経医学 英単2026</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* 3Dカード反転スタイル */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    /* レンジスライダーのカスタマイズ */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 9999px;
      background: #e2e8f0;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      border: 2.5px solid #4f46e5;
      box-shadow: 0 2px 5px rgba(79, 70, 229, 0.25);
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      border: 2.5px solid #4f46e5;
      box-shadow: 0 2px 5px rgba(79, 70, 229, 0.25);
      cursor: pointer;
    }

    /* スクロールバー */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #f8fafc;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 min-h-screen flex justify-center items-start sm:py-6 p-0 select-none">

  <!-- メインコンテナ -->
  <div class="w-full max-w-md bg-white sm:rounded-3xl sm:shadow-2xl sm:border sm:border-slate-100 overflow-hidden flex flex-col min-h-screen sm:min-h-[780px]">

    <!-- 1. ヘッダーエリア -->
    <header class="bg-[#4f46e5] text-white px-4 py-3.5 flex items-center justify-between shadow-sm relative z-10">
      <div class="flex items-center gap-2">
        <div class="p-1.5 bg-white/15 rounded-xl backdrop-blur-sm">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
        </div>
        <h1 class="text-sm sm:text-base font-extrabold tracking-tight">精神神経医学 英単2026</h1>

      <div class="flex items-center gap-1.5">
        <!-- 一覧モーダルボタン -->
        <button id="openListModalBtn" class="bg-white/15 hover:bg-white/25 active:scale-95 transition-all text-white p-1.5 rounded-full" title="単語一覧を開く">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h7" />
          </svg>
        </button>
        <!-- Saved バッジ -->
        <div id="saveBadge" class="bg-white/20 backdrop-blur-sm text-white text-[11px] px-2.5 py-1 rounded-full flex items-center gap-1 font-semibold">
          <svg class="w-3 h-3 text-emerald-300" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />

        <!-- カウンターバッジ -->
        <div id="counterBadge" class="bg-white/25 backdrop-blur-sm text-white text-xs px-2.5 py-1 rounded-full font-bold">
          1 / 245

    </header>

    <!-- プログレスバー -->
    <div class="w-full bg-slate-100 h-1">
      <div id="progressBar" class="bg-indigo-500 h-1 transition-all duration-300" style="width: 0.4%;"></div>
    </div>

    <!-- コンテンツメイン -->
    <main class="flex-1 p-3.5 flex flex-col justify-between gap-3">

      <!-- 2. コントロールバー -->
      <section class="grid grid-cols-12 gap-2 items-center">
        <!-- 絞り込みフィルター選択（出題年・全件） -->
        <div class="col-span-6 relative">
          <select id="filterSelect" class="w-full appearance-none bg-white border border-slate-200 hover:border-indigo-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 cursor-pointer pr-7">
            <option value="all">すべて (全245語)</option>
            <option value="has_years">🔥 過去問出題歴あり</option>
            <option value="frequent">⭐ 超頻出 (2回以上出題)</option>
            <option value="y24">2024年 出題 ('24)</option>
            <option value="y23">2023年 出題 ('23)</option>
            <option value="y22">2022年 出題 ('22)</option>
            <option value="y21">2021年 出題 ('21)</option>
            <option value="y20">2020年 出題 ('20)</option>
            <option value="y19">2019年 出題 ('19)</option>

          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 9l4-4 4 4m0 6l-4 4-4-4" />
            </svg>

        <!-- ✓Only トグルボタン -->

          <span id="checkOnlyIcon" class="text-xs">☐</span>
          <span>✓Only</span>

        <!-- 🔄 OFF/ON トグルボタン (シャッフル) -->
        <button id="shuffleToggleBtn" class="col-span-3 h-full border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 rounded-xl px-1.5 py-2 text-xs font-bold flex items-center justify-center gap-1 shadow-sm transition-all">

      </section>

      <!-- 3. オートプレイ設定バー -->

        <div class="flex items-center justify-between text-xs">
          <div class="flex items-center gap-1 text-slate-500 font-bold">
            <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span>オートプレイ設定</span>

        <div class="flex items-center gap-3 pt-0.5">

            <svg id="autoPlayIcon" class="w-3 h-3 fill-current" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <span id="autoPlayBtnText">再生</span>

          <!-- スライダー + 秒数表示 -->
          <div class="flex-1 flex flex-col justify-center">

            <input id="intervalSlider" type="range" min="1" max="7" value="2.5" step="0.5" class="w-full cursor-pointer">
          </div>
        </div>
      </section>

      <!-- 4. メインフラッシュカード (添付画像準拠UI) -->
      <section class="perspective-1000 my-0.5">

          <!-- カード表面 (白背景・中央上部言語・中央単語・下部出題バッジ) -->

            <!-- 上部：言語ラベル（中央配置） -->

              <button id="ttsBtnFront" class="text-slate-500 hover:text-indigo-600 transition-colors inline-flex items-center p-0.5 rounded" title="発音を聞く">
                <span class="text-base leading-none">🔊</span>
              </button>
            </div>
            
            <!-- 中央：単語テキスト（大きく太字、中央揃え） -->
            <div class="flex flex-col items-center justify-center flex-1 px-2 text-center w-full">
              <h2 id="cardTextFront" class="text-3xl sm:text-4xl font-extrabold text-[#1e293b] tracking-tight leading-snug break-words">
                abuse
              </h2>
            </div>

            <!-- 下部：出題年度バッジ群（中央横並び配置） -->
            <div id="yearBadgesFront" class="flex items-center justify-center gap-2 flex-wrap min-h-[28px]">
              <!-- JSで動的挿入 (例: '24 出題, '23 出題) -->
            </div>
          </div>

          <!-- カード裏面 (淡いラベンダー背景・中央上部言語＆スピーカー・中央単語・下部出題バッジ) -->
          <div class="absolute inset-0 w-full h-full bg-[#fbf9fe] rounded-3xl border border-purple-200/80 shadow-[0_8px_30px_rgb(0,0,0,0.05)] p-6 flex flex-col justify-between items-center backface-hidden rotate-y-180">
            <!-- 上部：言語ラベル ＆ スピーカーアイコン（中央配置） -->
            <div class="flex items-center justify-center gap-1.5">
              <span id="cardLangBack" class="text-xs text-slate-500 font-bold tracking-wider">日本語</span>
              <!-- 発音アイコン -->
              <button id="ttsBtnBack" class="text-slate-500 hover:text-indigo-600 transition-colors inline-flex items-center p-0.5 rounded" title="英語の発音を聞く">
                <span class="text-base leading-none">🔊</span>
              </button>
            </div>
            
            <!-- 中央：単語テキスト（大きく太字、中央揃え） -->
            <div class="flex flex-col items-center justify-center flex-1 px-2 text-center w-full">
              <h2 id="cardTextBack" class="text-3xl sm:text-4xl font-extrabold text-[#1e293b] tracking-tight leading-snug break-words">

            <div id="yearBadgesBack" class="flex items-center justify-center gap-2 flex-wrap min-h-[28px]">

          </svg>
          <span id="cardCheckText">分からない単語としてチェック</span>
        </button>
      </section>

      <!-- 6. ナビゲーションフッター -->
      <footer class="flex items-center gap-2 pt-1 pb-1">
        <!-- 前へボタン -->
        <button id="prevBtn" class="w-[32%] py-3.5 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-bold text-xs sm:text-sm shadow-sm active:scale-95 transition-all flex items-center justify-center gap-1">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
          <span>前へ</span>

          <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">

          </svg>
        </button>

        <!-- 次へボタン -->
        <button id="nextBtn" class="flex-1 py-3.5 rounded-2xl bg-[#4f46e5] hover:bg-[#4338ca] text-white font-bold text-xs sm:text-sm shadow-md shadow-indigo-200 active:scale-95 transition-all flex items-center justify-center gap-1">
          <span>次へ</span>
          <svg class="w-4 h-4 text-white/90" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </footer>

    </main>
  </div>

  <!-- 単語一覧モーダル -->
  <div id="listModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-end sm:items-center hidden opacity-0 transition-opacity duration-200">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[88vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-indigo-50/60">
        <div class="flex items-center gap-2">
          <span class="text-base font-black text-slate-800">精神神経医学 必修英単語一覧</span>
          <span id="modalListCount" class="text-xs font-bold text-indigo-600 bg-indigo-100 px-2 py-0.5 rounded-full">245語</span>

            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />

      <div class="p-3 border-b border-slate-100 bg-white">
        <div class="relative">

          <svg class="w-4 h-4 text-slate-400 absolute left-2.5 top-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />

        </div>
      </div>

      <!-- リストコンテナ -->
      <div id="modalWordContainer" class="flex-1 overflow-y-auto p-3 divide-y divide-slate-100 text-xs"></div>
    </div>
  </div>

    // チェック状態の読み込み
    function loadSavedChecks() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const checkedIds = JSON.parse(saved);
          masterWordList.forEach(w => {
            w.checked = checkedIds.includes(w.id);
          });
        }
      } catch (e) {
        console.warn("Storage restricted", e);
      }
    }

    // チェック状態の保存
    function saveChecks() {
      try {
        const checkedIds = masterWordList.filter(w => w.checked).map(w => w.id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(checkedIds));
        showSavedIndicator();
      } catch (e) {
        console.warn("Could not save", e);
      }
    }

    function showSavedIndicator() {
      saveStatusText.textContent = "Saved";
      saveStatusText.parentElement.classList.add("scale-105");
      setTimeout(() => {
        saveStatusText.parentElement.classList.remove("scale-105");
      }, 300);
    }

    // フィルターの適用
    function updateFilteredList() {
      const filterMode = filterSelect.value;
      let list = [...masterWordList];

      if (filterMode === "has_years") {
        list = list.filter(w => w.years && w.years.length > 0);
      } else if (filterMode === "frequent") {
        list = list.filter(w => w.years && w.years.length >= 2);
      } else if (filterMode.startsWith("y")) {
        const targetYear = filterMode.replace("y", "");
        list = list.filter(w => w.years && w.years.includes(targetYear));
      }

      if (isCheckedOnly) {
        list = list.filter(w => w.checked);
      }

      if (isShuffle) {
        for (let i = list.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [list[i], list[j]] = [list[j], list[i]];
        }
      }

      activeList = list;
      currentIndex = 0;
      isFlipped = false;
      applyFlipState();
    }

    // カード描画（添付画像のUIに完全準拠）
    function renderCard() {
      const total = activeList.length;

      if (total === 0) {
        counterBadge.textContent = "0 / 0";
        progressBar.style.width = "0%";
        cardTextFront.textContent = "該当単語なし";
        cardTextBack.textContent = "-";
        yearBadgesFront.innerHTML = "";
        yearBadgesBack.innerHTML = "";
        updateCheckBtnUI(false);
        return;
      }

      if (currentIndex >= total) currentIndex = 0;
      if (currentIndex < 0) currentIndex = total - 1;

      const word = activeList[currentIndex];
      counterBadge.textContent = `${currentIndex + 1} / ${total}`;
      progressBar.style.width = `${((currentIndex + 1) / total) * 100}%`;

      // 日英の向き
      if (isEnToJa) {
        cardLangFront.textContent = "英語";
        cardTextFront.textContent = word.en;
        cardLangBack.textContent = "日本語";
        cardTextBack.textContent = word.ja;
        intervalLabel.textContent = `日本語表示: ${playIntervalSec}秒`;
      } else {
        cardLangFront.textContent = "日本語";
        cardTextFront.textContent = word.ja;
        cardLangBack.textContent = "英語";
        cardTextBack.textContent = word.en;
        intervalLabel.textContent = `英語表示: ${playIntervalSec}秒`;
      }

      // 添付画像のバッジUI（'24 出題, '23 出題）を生成
      const badgeHTML = renderImageStyleBadges(word.years);
      yearBadgesFront.innerHTML = badgeHTML;
      yearBadgesBack.innerHTML = badgeHTML;

      updateCheckBtnUI(word.checked);
    }

    // 添付画像のサーモンピンク系出題年度ピル（例: '24 出題）
    function renderImageStyleBadges(years) {
      if (!years || years.length === 0) return "";
      return years.map(y => `
        <span class="inline-flex items-center justify-center bg-[#fee2e2] text-[#991b1b] border border-[#fecaca] text-[11px] sm:text-xs font-bold px-2.5 py-0.5 rounded-lg shadow-2xs">
          ’${y} 出題
        </span>
      `).join("");
    }

    // チェックボタンUI（未チェック: 白 / チェック済: 淡いパープル）
    function updateCheckBtnUI(isChecked) {
      if (isChecked) {
        checkCardBtn.className = "w-full rounded-2xl py-3.5 px-4 font-bold text-xs sm:text-sm flex items-center justify-center gap-2 border-2 transition-all shadow-sm border-indigo-200 bg-[#ede9fe] text-[#5b21b6]";
        cardCheckIcon.innerHTML = `
          <rect x="3" y="3" width="18" height="18" rx="4" fill="#5b21b6" stroke="#5b21b6" stroke-width="2"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M7 12.5l3.5 3.5 6.5-7" stroke="#ffffff" stroke-width="2.5"/>
        `;
        cardCheckText.textContent = "分からない単語 (チェック済み)";
      } else {
        checkCardBtn.className = "w-full rounded-2xl py-3.5 px-4 font-bold text-xs sm:text-sm flex items-center justify-center gap-2 border-2 transition-all shadow-sm border-slate-200 bg-white text-slate-600 hover:border-slate-300";
        cardCheckIcon.innerHTML = `<rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>`;
        cardCheckText.textContent = "分からない単語としてチェック";
      }
    }

    // カードの反転
    function toggleFlip() {
      if (activeList.length === 0) return;
      isFlipped = !isFlipped;
      applyFlipState();
    }

    function applyFlipState() {
      if (isFlipped) {
        flashcard.classList.add("rotate-y-180");
      } else {
        flashcard.classList.remove("rotate-y-180");
      }
    }

    function nextCard() {
      if (activeList.length === 0) return;
      currentIndex = (currentIndex + 1) % activeList.length;
      isFlipped = false;
      applyFlipState();
      renderCard();
    }

    function prevCard() {
      if (activeList.length === 0) return;
      currentIndex = (currentIndex - 1 + activeList.length) % activeList.length;
      isFlipped = false;
      applyFlipState();
      renderCard();
    }

    function toggleCheck() {
      if (activeList.length === 0) return;
      const word = activeList[currentIndex];
      word.checked = !word.checked;

      const target = masterWordList.find(w => w.id === word.id);
      if (target) target.checked = word.checked;

      saveChecks();
      updateCheckBtnUI(word.checked);

      if (isCheckedOnly && !word.checked) {
        updateFilteredList();
        renderCard();
      }
    }

    // 英語発音 (Web Speech API)
    function speakEnglish(e) {
      if (e) e.stopPropagation();
      if (activeList.length === 0) return;
      const word = activeList[currentIndex];
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(word.en);
        utter.lang = 'en-US';
        utter.rate = 0.9;
        window.speechSynthesis.speak(utter);
      }
    }

    // オートプレイ
    function toggleAutoPlay() {
      if (isAutoPlaying) {
        stopAutoPlay();
      } else {
        startAutoPlay();
      }
    }

    function startAutoPlay() {
      if (activeList.length === 0) return;
      isAutoPlaying = true;
      autoPlayBtn.className = "bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-300 rounded-xl px-4 py-1.5 text-xs font-bold flex items-center gap-1.5 transition-all shadow-sm shrink-0";
      autoPlayIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
      autoPlayBtnText.textContent = "停止";

      runAutoPlayStep();
    }

    function stopAutoPlay() {
      isAutoPlaying = false;
      if (autoPlayTimer) clearTimeout(autoPlayTimer);
      autoPlayBtn.className = "bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200/80 rounded-xl px-4 py-1.5 text-xs font-bold flex items-center gap-1.5 transition-all shadow-sm shrink-0";
      autoPlayIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
      autoPlayBtnText.textContent = "再生";
    }

    function runAutoPlayStep() {
      if (!isAutoPlaying) return;
      const durationMs = playIntervalSec * 1000;

      if (!isFlipped) {
        autoPlayTimer = setTimeout(() => {
          if (!isAutoPlaying) return;
          toggleFlip();
          runAutoPlayStep();
        }, durationMs);
      } else {
        autoPlayTimer = setTimeout(() => {
          if (!isAutoPlaying) return;
          nextCard();
          runAutoPlayStep();
        }, durationMs * 0.9);
      }
    }

    // 単語一覧モーダル
    function openListModal() {
      listModal.classList.remove("hidden");
      setTimeout(() => listModal.classList.remove("opacity-0"), 10);
      renderModalList("");
      modalSearchInput.value = "";
    }

    function closeListModal() {
      listModal.classList.add("opacity-0");
      setTimeout(() => listModal.classList.add("hidden"), 200);
    }

    function renderModalList(searchQuery) {
      const q = searchQuery.toLowerCase().trim();
      const filtered = masterWordList.filter(w => {
        return w.en.toLowerCase().includes(q) || w.ja.includes(q) || (w.years && w.years.join(" ").includes(q));
      });

      modalListCount.textContent = `${filtered.length}語`;
      modalWordContainer.innerHTML = filtered.map(w => {
        const badges = w.years && w.years.length > 0 
          ? w.years.map(y => `<span class="bg-[#fee2e2] text-[#991b1b] text-[10px] font-bold px-1.5 py-0.2 rounded">’${y} 出題</span>`).join(" ")
          : '';
        return `
          <div class="py-2.5 px-2 flex items-center justify-between hover:bg-slate-50 cursor-pointer rounded-xl transition-colors group" onclick="jumpToWord(${w.id})">
            <div class="flex-1 pr-2">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="font-bold text-slate-800 text-xs sm:text-sm group-hover:text-indigo-600">${w.en}</span>
                ${badges}
              </div>
              <div class="text-slate-500 text-[11px] mt-0.5">${w.ja}</div>
            </div>
            <span class="text-xs ${w.checked ? 'text-[#5b21b6] font-bold' : 'text-slate-300'}">
              ${w.checked ? '☑' : '☐'}
            </span>
          </div>
        `;
      }).join("");
    }

    window.jumpToWord = function(wordId) {
      const idx = activeList.findIndex(w => w.id === wordId);
      if (idx !== -1) {
        currentIndex = idx;
      } else {
        filterSelect.value = "all";
        isCheckedOnly = false;
        checkedOnlyBtn.className = "col-span-3 h-full border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 rounded-xl px-1.5 py-2 text-xs font-bold flex items-center justify-center gap-1 shadow-sm transition-all";
        checkOnlyIcon.textContent = "☐";
        updateFilteredList();
        currentIndex = activeList.findIndex(w => w.id === wordId);
      }
      isFlipped = false;
      applyFlipState();
      renderCard();
      closeListModal();
    };

    // イベント登録
    function setupEventListeners() {
      flashcard.addEventListener("click", toggleFlip);
      nextBtn.addEventListener("click", nextCard);
      prevBtn.addEventListener("click", prevCard);
      resetFlipBtn.addEventListener("click", () => {
        isFlipped = false;
        applyFlipState();
      });

      checkCardBtn.addEventListener("click", toggleCheck);
      ttsBtnFront.addEventListener("click", speakEnglish);
      ttsBtnBack.addEventListener("click", speakEnglish);

      filterSelect.addEventListener("change", () => {
        updateFilteredList();
        renderCard();
      });

      checkedOnlyBtn.addEventListener("click", () => {
        isCheckedOnly = !isCheckedOnly;
        if (isCheckedOnly) {
          checkedOnlyBtn.className = "col-span-3 h-full border border-indigo-300 bg-[#ede9fe] text-[#5b21b6] rounded-xl px-1.5 py-2 text-xs font-bold flex items-center justify-center gap-1 shadow-sm transition-all";
          checkOnlyIcon.textContent = "☑";
        } else {
          checkedOnlyBtn.className = "col-span-3 h-full border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 rounded-xl px-1.5 py-2 text-xs font-bold flex items-center justify-center gap-1 shadow-sm transition-all";
          checkOnlyIcon.textContent = "☐";
        }
        updateFilteredList();
        renderCard();
      });

      shuffleToggleBtn.addEventListener("click", () => {
        isShuffle = !isShuffle;
        if (isShuffle) {
          shuffleStatusText.textContent = "ON";
          shuffleToggleBtn.classList.add("text-indigo-600", "border-indigo-200", "bg-indigo-50/50");
        } else {
          shuffleStatusText.textContent = "OFF";
          shuffleToggleBtn.classList.remove("text-indigo-600", "border-indigo-200", "bg-indigo-50/50");
        }
        updateFilteredList();
        renderCard();
      });

      directionToggleBtn.addEventListener("click", () => {
        isEnToJa = !isEnToJa;
        directionText.textContent = isEnToJa ? "英 → 日" : "日 → 英";
        isFlipped = false;
        applyFlipState();
        renderCard();
      });

      intervalSlider.addEventListener("input", (e) => {
        playIntervalSec = parseFloat(e.target.value);
        intervalLabel.textContent = `${isEnToJa ? "日本語" : "英語"}表示: ${playIntervalSec}秒`;
      });

      autoPlayBtn.addEventListener("click", toggleAutoPlay);

      openListModalBtn.addEventListener("click", openListModal);
      closeListModalBtn.addEventListener("click", closeListModal);
      modalSearchInput.addEventListener("input", (e) => renderModalList(e.target.value));

      window.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
        if (e.key === "ArrowRight") nextCard();
        if (e.key === "ArrowLeft") prevCard();
        if (e.key === " ") {
          e.preventDefault();
          toggleFlip();
        }
        if (e.key === "ArrowUp") {
          e.preventDefault();
          toggleCheck();
        }
        if (e.key === "s" || e.key === "S") {
          speakEnglish();
        }
      });
    }

    window.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
